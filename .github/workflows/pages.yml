# Publishes the prototype to GitHub Pages whenever it or the simulation changes on main.
# Pages must be enabled for the repository with "GitHub Actions" as its source (Settings > Pages).
name: Publish prototype

on:
  push:
    branches: [main]
    paths:
      - prototype/**
      - sim/**
      - tools/build-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; let a running one finish rather than cancelling it halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the site
        run: bash tools/build-site.sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
